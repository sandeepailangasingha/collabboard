name: SyncBoard Continuous Integration (CI)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & WebSocket Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Start Server in Background for Test Suite
        env:
          PORT: 5000
          JWT_SECRET: syncboard_test_jwt_secret
          MONGO_URI: mongodb+srv://sandeepakavindu88_admin:AtlasM3Password2026!@cluster0.4820k0e.mongodb.net/syncboard?retryWrites=true&w=majority&appName=Cluster0
          NODE_ENV: test
        run: |
          cd server
          node src/server.js &
          echo "Server started in background (PID $!)"

      - name: Wait for Server to be Ready
        run: |
          echo "Waiting for server on port 5000..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/api > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              break
            fi
            echo "  Attempt $i/30: server not ready yet..."
            sleep 1
          done
          curl -s http://localhost:5000/api || (echo "Server failed to start" && exit 1)

      - name: Run Backend Integration & Unit Tests
        env:
          TEST_API_URL: http://localhost:5000/api
        run: |
          cd server
          npm test

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Run Code Linter
        run: |
          cd client
          npm run lint

      - name: Run Production Bundle Build
        run: |
          cd client
          npm run build
