name: SyncBoard Continuous Integration (CI)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & WebSocket Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Wait for MongoDB Service
        run: |
          node -e "
            const net = require('net');
            function check(retries = 30) {
              const client = net.createConnection(27017, '127.0.0.1', () => {
                console.log('MongoDB service is ready on 127.0.0.1:27017');
                client.destroy();
                process.exit(0);
              });
              client.on('error', () => {
                if (retries <= 1) {
                  console.error('Timeout waiting for MongoDB service');
                  process.exit(1);
                }
                setTimeout(() => check(retries - 1), 1000);
              });
            }
            check();
          "

      - name: Seed Database
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/syncboard_test
          NODE_ENV: test
        run: |
          cd server
          node src/seed.js

      - name: Start Server in Background
        env:
          PORT: 5000
          JWT_SECRET: syncboard_test_jwt_secret
          MONGO_URI: mongodb://127.0.0.1:27017/syncboard_test
          NODE_ENV: test
        run: |
          cd server
          node src/server.js &
          echo "Server running in background"

      - name: Wait for Server to be Ready
        run: |
          node -e "
            async function waitServer(retries = 30) {
              for (let i = 1; i <= retries; i++) {
                try {
                  const res = await fetch('http://127.0.0.1:5000/api');
                  if (res.ok) {
                    console.log('Server is responsive after ' + i + ' attempts');
                    process.exit(0);
                  }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 1000));
              }
              console.error('Server failed to start in time');
              process.exit(1);
            }
            waitServer();
          "

      - name: Run Backend Integration & Unit Tests
        env:
          TEST_API_URL: http://127.0.0.1:5000/api
        run: |
          cd server
          npm test

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Run Code Linter
        run: |
          cd client
          npm run lint

      - name: Run Production Bundle Build
        run: |
          cd client
          npm run build
