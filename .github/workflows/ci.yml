name: SyncBoard Continuous Integration (CI)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & WebSocket Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Seed Test User into Local MongoDB
        run: |
          mongosh mongodb://localhost:27017/syncboard_test --eval '
            db.users.deleteMany({ email: "sandeepa@example.com" });
            db.users.insertOne({
              name: "Sandeepa Ilangasingha",
              email: "sandeepa@example.com",
              password: "password123",
              role: "Admin",
              avatarColor: "#6366f1",
              createdAt: new Date(),
              updatedAt: new Date()
            });
            print("Test user seeded OK");
          '

      - name: Start Server in Background
        env:
          PORT: 5000
          JWT_SECRET: syncboard_test_jwt_secret
          MONGO_URI: mongodb://localhost:27017/syncboard_test
          NODE_ENV: test
        run: |
          cd server
          node src/server.js &
          echo "Server started (PID $!)"

      - name: Wait for Server to be Ready
        run: |
          echo "Waiting for server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            echo "  Attempt $i/30 - not ready yet..."
            sleep 1
          done
          curl -sf http://localhost:5000/api || (echo "ERROR: Server never became ready" && exit 1)

      - name: Run Backend Integration & Unit Tests
        env:
          TEST_API_URL: http://localhost:5000/api
        run: |
          cd server
          npm test

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Run Code Linter
        run: |
          cd client
          npm run lint

      - name: Run Production Bundle Build
        run: |
          cd client
          npm run build
